<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Halo+</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="mark" src="icon.svg" alt="" width="28" height="28" />
      <span class="word">Halo+</span>
      <span id="plan" class="plan" hidden></span>
    </header>

    <p id="status" class="status" aria-live="polite"></p>

    <button id="sync" class="sync" type="button">Sync now</button>
    <div id="progress" class="progress" hidden>
      <div class="bar"><i id="fill"></i></div>
      <p id="step" class="step"></p>
    </div>

    <div id="problem" class="problem" role="alert" hidden>
      <p id="problemText"></p>
      <a id="problemAction" class="problem-action" target="_blank" hidden></a>
    </div>

    <p id="plus" class="plus" hidden><span id="plusText"></span> <a id="upgrade" class="upgrade" target="_blank"></a></p>

    <footer class="foot">
      <a id="open" class="open" target="_blank">Open Halo+</a>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
