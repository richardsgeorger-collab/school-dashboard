<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Halo+</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="mark" src="icon.svg" alt="" width="26" height="26" />
      <span class="word">Halo+</span>
      <span id="plan" class="plan" hidden></span>
    </header>

    <section id="setup" class="setup" aria-live="polite" hidden>
      <p id="setupTitle" class="setup-title"></p>
      <div id="setupBar" class="bar" hidden><i id="setupFill"></i></div>
      <p id="setupText" class="step"></p>
      <button id="setupGo" class="sync" type="button" hidden></button>
      <button id="setupAlt" class="setup-alt" type="button" hidden></button>
    </section>

    <main id="normal">
      <a id="next" class="next-up" target="_blank" hidden>
        <span id="nextHead" class="eyebrow">Next up</span>
        <span id="nextTitle" class="next-title"></span>
        <span id="nextMeta" class="next-meta"></span>
      </a>

      <p id="status" class="status" aria-live="polite"></p>

      <button id="sync" class="sync" type="button">Sync now</button>
      <div id="progress" class="progress" hidden>
        <div class="bar"><i id="fill"></i></div>
        <p id="step" class="step"></p>
      </div>

      <div id="problem" class="problem" role="alert" hidden>
        <p id="problemText"></p>
        <a id="problemAction" class="problem-action" target="_blank" hidden></a>
      </div>

      <p id="plus" class="plus" hidden><span id="plusText"></span> <a id="upgrade" class="upgrade" target="_blank"></a></p>
    </main>

    <label class="toggle">
      <span>Show Halo+ on Halo pages</span>
      <input id="onHalo" type="checkbox" role="switch" />
    </label>
    <details id="feats" class="feats" hidden>
      <summary>Choose what shows on Halo</summary>
      <div id="featList" class="feat-list"></div>
    </details>

    <footer class="foot">
      <a id="open" class="open" target="_blank">Open Halo+</a>
    </footer>
    <script src="halo-model.js"></script>
    <script src="onhalo/features.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
