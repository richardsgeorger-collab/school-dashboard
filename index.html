<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="./favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="icon" href="./favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The font stylesheet loads without blocking the first paint: text shows in the system face, then swaps. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Halo+: the planner built for Halo</title>
    <meta name="description" content="Every GCU Halo deadline in one place, even the ones hidden in announcements. Your classes, assignments, grades and every announcement on one screen that says what to do next. Syncs itself; never your password. Independent, not affiliated with GCU." />
    <link rel="canonical" href="https://haloplus.app/" />
    <!-- What a pasted link shows in a group chat, Discord, Reddit or a text: the promise and the picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Halo+" />
    <meta property="og:title" content="Halo+: the planner built for Halo" />
    <meta property="og:description" content="Every GCU Halo deadline in one place, even the ones hidden in announcements. One screen that says what to do next. Syncs itself; never your password." />
    <meta property="og:url" content="https://haloplus.app/" />
    <meta property="og:image" content="https://haloplus.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Halo+: Every GCU deadline in one place. Even the ones hidden in announcements." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Halo+: the planner built for Halo" />
    <meta name="twitter:description" content="Every GCU Halo deadline in one place, even the ones hidden in announcements. Syncs itself; never your password." />
    <meta name="twitter:image" content="https://haloplus.app/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Halo+",
        "alternateName": "Halo Plus",
        "url": "https://haloplus.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "The planner built for Halo: your GCU classes, assignments, grades and every announcement on one screen that says what to do next. Independent, not affiliated with Grand Canyon University.",
        "image": "https://haloplus.app/og.png"
      }
    </script>
    <!-- The landing page's Questions, as structured data; src/landing/meta.test.ts keeps the two in step. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          { "@type": "Question", "name": "Does it need my GCU password?", "acceptedAnswer": { "@type": "Answer", "text": "No, and it never asks. The extension and the bookmark use the Halo session you already have in your browser. The code is public on GitHub, so anyone can check." } },
          { "@type": "Question", "name": "Is this from GCU?", "acceptedAnswer": { "@type": "Answer", "text": "No. Halo+ is an independent planner made by a student. It is not affiliated with, endorsed by, or connected to Grand Canyon University. Halo is GCU's learning platform." } },
          { "@type": "Question", "name": "What happens to my data?", "acceptedAnswer": { "@type": "Answer", "text": "It is yours. Export everything as one file any time, or delete the account and all of it in one tap. AI features send only the text they need and nothing is kept by the model provider." } },
          { "@type": "Question", "name": "Does it work on my phone?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Add it to your Home Screen and it works like an app, notifications included. The bookmark works on a phone too." } }
        ]
      }
    </script>
    <!-- The landing page is pre-rendered into #root for search engines and first paint (vite.config.ts). Anyone
         returning (signed in, local classes, or any #/ address) gets the app, so the pre-rendered page stays hidden for them. -->
    <script>
      try {
        var h = location.hash;
        var ls = window.localStorage, back = false;
        for (var i = 0; i < ls.length; i++) {
          var k = ls.key(i) || '';
          if (/^sb-[a-z0-9]+-auth-token$/.test(k) || (k === 'school-dashboard:v1' && /"courses":\[\{/.test(ls.getItem(k) || ''))) back = true;
        }
        if ((h && h !== '#' && h !== '#/') || back) document.documentElement.className += ' booting-app';
      } catch (e) {}
    </script>
    <style>
      .booting-app #root > .prerendered { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
